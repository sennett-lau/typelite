<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Typelite — Just say it. Free voice typing for macOS</title>
    <meta name="description" content="Typelite is a free, open-source voice keyboard for macOS. Press a shortcut, speak, and clean text lands in any app. Runs on your computer, no account." />
    <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07090e" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="https://sennett-lau.github.io/typelite/" />
    <link rel="icon" href="/typelite/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/typelite/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/typelite/apple-touch-icon.png" sizes="180x180" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Typelite contributors" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Typelite" />
    <meta property="og:title" content="Typelite — Just say it." />
    <meta property="og:description" content="Typelite is a free, open-source voice keyboard for macOS. Press a shortcut, speak, and clean text lands in any app. Runs on your computer, no account." />
    <meta property="og:url" content="https://sennett-lau.github.io/typelite/" />
    <meta property="og:image" content="https://sennett-lau.github.io/typelite/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:locale" content="en_US" />
    <meta
      property="og:image:alt"
      content="Typelite: Just say it. The dark glass pill with its aurora light, listening."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Typelite — Just say it." />
    <meta
      name="twitter:description"
      content="Free, open-source voice typing for macOS. Speak, and clean text lands where you're typing."
    />
    <meta name="twitter:image" content="https://sennett-lau.github.io/typelite/og.png" />
    <meta
      name="twitter:image:alt"
      content="Typelite: Just say it. The dark glass pill with its aurora light, listening."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Typelite",
        "description": "A free, open-source voice keyboard for macOS. Press a shortcut in any app, speak, and clean text lands where you are typing. Speech recognition and AI polish can run on your own computer.",
        "url": "https://sennett-lau.github.io/typelite/",
        "image": "https://sennett-lau.github.io/typelite/og.png",
        "operatingSystem": "macOS",
        "applicationCategory": "ProductivityApplication",
        "applicationSubCategory": "UtilitiesApplication",
        "downloadUrl": "https://github.com/sennett-lau/typelite/releases",
        "codeRepository": "https://github.com/sennett-lau/typelite",
        "license": "https://github.com/sennett-lau/typelite/blob/main/LICENSE",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <script>
      // Apply a theme the visitor picked earlier before the first paint (no flash).
      try {
        var t = localStorage.getItem('typelite-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
