<title>Typelite Key Labels</title>
<style>
  :root { --page:#eef1f6; --ink:#1d1d1f; --muted:#6e6e73; --faint:#8e8e93; --card:#fff; --line:rgba(0,0,0,.12); --field:#f2f2f5; --accent:#0a84ff;
    --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme:dark; --page:#0c0d10; --ink:#f2f2f5; --muted:#9a9aa3; --faint:#7c7c85; --card:#1c1e24; --line:rgba(255,255,255,.14); --field:#262a33; --accent:#3fd8c2; } }
  :root[data-theme="dark"] { color-scheme:dark; --page:#0c0d10; --ink:#f2f2f5; --muted:#9a9aa3; --faint:#7c7c85; --card:#1c1e24; --line:rgba(255,255,255,.14); --field:#262a33; --accent:#3fd8c2; }
  body { background:var(--page); color:var(--ink); font-family:var(--ui); }
  .wrap { max-width:900px; margin:0 auto; padding:28px 16px 48px; display:flex; flex-direction:column; gap:22px; }
  h1 { margin:0; font-size:22px; } .lead { margin:4px 0 0; color:var(--muted); line-height:1.5; max-width:70ch; }
  .opt { display:flex; flex-direction:column; gap:10px; }
  .opt h2 { margin:0; font-size:14px; display:flex; gap:8px; align-items:center; }
  .rec { font-size:10.5px; font-weight:700; padding:1px 7px; border-radius:999px; background:color-mix(in srgb,var(--accent) 16%,transparent); color:var(--accent); }
  .opt p { margin:0; font-size:12.5px; color:var(--muted); }
  .tiles { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; max-width:560px; }
  .tile { background:var(--card); border-radius:12px; box-shadow:0 0 0 .5px var(--line); padding:12px; display:flex; flex-direction:column; gap:10px; min-width:0; }
  .tile b { font-size:13.5px; }
  .kk { display:flex; gap:4px; flex-wrap:wrap; }
  kbd { position:relative; font-family:inherit; font-size:11.5px; font-weight:600; padding:1px 7px; border-radius:5px; background:var(--field); border:1px solid var(--line); border-bottom-width:2px; color:var(--ink); white-space:nowrap; }
  kbd.sym { font-size:13px; padding:0 7px; }
  kbd .side { font-size:9px; font-weight:700; color:var(--muted); margin-left:2px; vertical-align:1px; }
  .map { font-size:12px; color:var(--muted); border-collapse:collapse; }
  .map td { padding:3px 14px 3px 0; } .map td:first-child { color:var(--faint); }
  @media (max-width:560px){ .tiles{ grid-template-columns:1fr; } }
</style>
<div class="wrap">
  <header><h1>Shorter key labels</h1><p class="lead">Your shortcuts on the Home tiles, in three styles. The same labels would appear everywhere a shortcut is shown (Home, Settings, onboarding, pill hints, the typing nudge). Hovering a key shows its full name.</p></header>
  <div id="out"></div>
</div>
<script>
(function(){
  var B=[['Dictate',['End']],['Translate',['End','RightShift']],['Ask anything',['End','RightControl']],['Example',['LeftOption','Command','K']]];
  var FULL={End:'End',RightShift:'Right Shift',RightControl:'Right Control',LeftOption:'Left Option',Command:'Command',K:'K',Shift:'Shift',Fn:'Fn'};
  var S={
    now:{t:'Today',d:'Full names. "Right Control" does not fit the tile.',f:function(k){return FULL[k];}},
    words:{t:'A · Short words',d:'Ctrl, Opt, Cmd, Shift; "R" / "L" for a side.',f:function(k){return {End:'End',RightShift:'R Shift',RightControl:'R Ctrl',LeftOption:'L Opt',Command:'Cmd',K:'K'}[k];}},
    sym:{t:'B · Mac symbols + side letter',d:'⌃ ⌥ ⇧ ⌘ like macOS menus; a small R or L marks a side. Shortest, and familiar to Mac users.',rec:true,f:function(k){var m={RightShift:['⇧','R'],RightControl:['⌃','R'],LeftOption:['⌥','L'],Command:['⌘','']}[k];return m?{s:m[0],side:m[1]}:{End:'End',K:'K'}[k];}},
    both:{t:'C · Symbol + short word',d:'⇧ Shift, ⌃ Ctrl — clear for everyone, a bit longer.',f:function(k){return {End:'End',RightShift:'R ⇧ Shift',RightControl:'R ⌃ Ctrl',LeftOption:'L ⌥ Opt',Command:'⌘ Cmd',K:'K'}[k];}}
  };
  var h='';
  ['now','words','sym','both'].forEach(function(id){
    var o=S[id];
    h+='<section class="opt"><h2>'+o.t+(o.rec?' <span class="rec">Recommended</span>':'')+'</h2><p>'+o.d+'</p><div class="tiles">';
    B.forEach(function(b){
      h+='<div class="tile"><b>'+b[0]+'</b><span class="kk">'+b[1].map(function(k){var v=o.f(k);
        if(v&&typeof v==='object') return '<kbd class="sym" title="'+FULL[k]+'">'+v.s+(v.side?'<span class="side">'+v.side+'</span>':'')+'</kbd>';
        return '<kbd title="'+FULL[k]+'">'+v+'</kbd>';}).join('')+'</span></div>';
    });
    h+='</div></section>';
  });
  h+='<section class="opt"><h2>All labels in option B</h2><table class="map"><tr><td>Control</td><td>⌃</td><td>Right Control</td><td>⌃ R</td></tr><tr><td>Option</td><td>⌥</td><td>Left Option</td><td>⌥ L</td></tr><tr><td>Shift</td><td>⇧</td><td>Right Shift</td><td>⇧ R</td></tr><tr><td>Command</td><td>⌘</td><td>Fn / End / Space / letters</td><td>unchanged</td></tr><tr><td>Shift (either side)</td><td>⇧</td><td>Return / Delete / Esc</td><td>↩ ⌫ esc</td></tr></table></section>';
  document.getElementById('out').innerHTML=h;
})();
</script>
