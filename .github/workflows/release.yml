# Builds Typelite for macOS (Apple Silicon) and creates a DRAFT GitHub release.
# See docs/releasing.md.
#
# - Push a tag `vX.Y.Z`: builds the DMG and ZIP, writes SHA256SUMS.txt and creates a draft
#   release named after the tag. A maintainer reviews the draft and publishes it by hand.
# - Run it by hand (Actions → Release → Run workflow): a dry run. Same build, but the files are
#   uploaded as a workflow artifact and no release is created.
#
# The app is signed with the project's own certificate (secrets APPLE_CERTIFICATE and
# APPLE_CERTIFICATE_PASSWORD; docs/releasing.md, "Signing"), not an Apple one, and it is not
# notarised: Gatekeeper still warns on the first launch, but macOS's Accessibility grant
# survives updates because every build carries the same signer.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the draft release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14 # Apple Silicon
    timeout-minutes: 90
    env:
      # The certificate imported below. "-" (ad hoc) would give every build a new signer.
      APPLE_SIGNING_IDENTITY: 'Typelite Signing'
    steps:
      - uses: actions/checkout@v7

      # The self-signed certificate goes into its own keychain, and codesign may use it
      # without a prompt. It is self-signed, so the runner must also be told to trust it for
      # code signing (in the admin trust domain; the runner allows sudo), or codesign refuses it.
      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo "::error::The APPLE_CERTIFICATE secret is missing (docs/releasing.md, Signing)."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/typelite-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          P12="$RUNNER_TEMP/typelite-signing.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-certificate -c "$APPLE_SIGNING_IDENTITY" -p "$KEYCHAIN" > "$RUNNER_TEMP/typelite-signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/typelite-signing.pem"
          rm -f "$P12"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "\"$APPLE_SIGNING_IDENTITY\""

      - name: Version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in package.json ($VERSION)."
            exit 1
          fi

      - name: Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup toolchain install || rustup show
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build llama-server (Built-in AI)
        run: npm run build:llama-server

      # As `npm run build:app`, plus the signed update package (plan `auto-update`):
      # tauri.release.conf.json turns on createUpdaterArtifacts, which writes
      # Typelite.app.tar.gz and its .sig, signed with the updater key.
      - name: Build the app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing (docs/releasing.md, Updates)."
            exit 1
          fi
          npx tauri build --bundles app --config src-tauri/tauri.release.conf.json

      # The installer DMG with the drag-to-Applications window. Tauri's own DMG step lays out
      # the window through Finder, which it skips on CI (and which times out without a
      # logged-in Finder), so dmgbuild writes the layout itself (scripts/dmg-settings.py).
      - name: Build the DMG
        run: bash scripts/build-dmg.sh "$PWD/src-tauri/target/release/bundle/macos/Typelite.app" "$PWD/src-tauri/target/release/bundle/Typelite.dmg"

      - name: Package and checksum
        id: package
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          BUNDLE=src-tauri/target/release/bundle
          mkdir -p dist-release
          cp "$BUNDLE/Typelite.dmg" "dist-release/Typelite_${VERSION}_aarch64.dmg"
          # ditto keeps the bundle's symlinks and signature intact.
          ditto -c -k --keepParent "$BUNDLE/macos/Typelite.app" "dist-release/Typelite_${VERSION}_aarch64.zip"
          codesign --verify --deep --strict --verbose=2 "$BUNDLE/macos/Typelite.app"
          # Plan `auto-update`: the signed update package and latest.json, which points at it.
          PACKAGE="Typelite_${VERSION}_aarch64.app.tar.gz"
          cp "$BUNDLE/macos/Typelite.app.tar.gz" "dist-release/$PACKAGE"
          cp "$BUNDLE/macos/Typelite.app.tar.gz.sig" "dist-release/$PACKAGE.sig"
          node scripts/updater-manifest.mjs "$VERSION" "dist-release/$PACKAGE.sig" \
            "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/$PACKAGE" \
            > dist-release/latest.json
          cd dist-release
          shasum -a 256 *.dmg *.zip *.app.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        run: node scripts/release-notes.mjs '${{ steps.version.outputs.version }}' > dist-release/notes.md

      - name: Upload (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: typelite-${{ steps.version.outputs.version }}-dry-run
          path: dist-release/
          retention-days: 7

      - name: Create draft release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist-release
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "Typelite ${{ steps.version.outputs.version }}" \
            --notes-file notes.md \
            ./*.dmg ./*.zip ./*.app.tar.gz ./*.app.tar.gz.sig latest.json SHA256SUMS.txt
