<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Typelite Dev: the app icon in amber instead of blue, with a DEV tag, so the development
       build is easy to tell from the release app in the Dock and in Finder. -->
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFF6E8"/>
      <stop offset="0.55" stop-color="#FFE2B8"/>
      <stop offset="1" stop-color="#FFC48A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#F06A0F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#5C2A0A" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2"/>
  <g fill="#2B1A0E">
    <rect x="315" y="252" width="210" height="72" rx="36"/>
    <rect x="384" y="252" width="72" height="440" rx="10"/>
    <rect x="315" y="620" width="210" height="72" rx="36"/>
  </g>
  <rect x="546" y="252" width="168" height="440" rx="30" fill="url(#bar)"/>
  <rect x="352" y="742" width="320" height="112" rx="56" fill="#2B1A0E"/>
  <text x="512" y="826" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="10" fill="#FFB547">DEV</text>
</svg>
